<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="container">
    <h2>Lista de Tareas</h2>
    
    <form id="formTarea">
      <div class="input-group">
        <input 
          type="text" 
          id="inputTarea" 
          placeholder="Escribe una tarea (Esc para borrar)" 
          autocomplete="off"
        >
        <button type="submit" id="btnAgregar">Agregar</button>
      </div>
    </form>

    <!-- Lista donde se agregarán dinámicamente las tareas -->
    <ul id="listaTareas" class="lista-tareas"></ul>
  </main>
    
</body>
</html>
