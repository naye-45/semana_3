<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comentario con limite </title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="container">
    <h2>Crear publicación</h2>
    <textarea 
      id="comentario" 
      placeholder="¿Qué estás pensando?" 
      maxlength="280"
      rows="5"
    ></textarea>

    <div class="footer-comentario">
      <!-- CONTADOR: Iniciará dinámicamente en 0/280 -->
      <span id="contador">0/280</span>
      
      <button id="btnPublicar">Publicar</button>
    </div>
  </main>
    
</body>
</html>
